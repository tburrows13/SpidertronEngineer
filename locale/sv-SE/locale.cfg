[mod-setting-description]
spidertron-engineer-allowed-out-of-spidertron=Välj [font=default-bold]Aldrig[/font] för den mest renodlade spelupplevelsen. Använd [font=default-bold]Begränsad tid[/font] för kompatibilitet med moddar som kräver att du är utanför ett fordon för att använda vissa funktioner. Med det alternativet dör du efter 12,5 sekunder utanför ett fordon. [font=default-bold]Obegränsad tid[/font] har inga begränsningar.
spidertron-engineer-allowed-into-entities=[font=default-bold]Begränsat[/font] tillåter bara att du stiger in i tåg. Använd [font=default-bold]Alla[/font] för att stiga in i vilket fordon som helst (även fordon från moddar).
spidertron-engineer-spawn-with-remote=Varje spelare börjar och återuppstår med en fjärrkontroll som är kopplad till den egna Spidertron.

spidertron-engineer-enable-compatibility-mode=Aktivera bara om andra moddar kräver vapen och rustningar som den här modden tar bort, eller om du verkligen behöver personlig rustning med utrustningsrutnät.

spidertron-engineer-enable-spidertron-space-science=Om detta är aktiverat rekommenderas att du även aktiverar en av de två följande inställningarna.
spidertron-engineer-space-science-to-fish=Lägger till ett recept som förbrukar 10 rymdforskningspaket och har 5 % chans att ge en fisk.
spidertron-engineer-rocket-returns-fish=Gör att varje raketuppskjutning i genomsnitt ger 1 fisk utöver de vanliga rymdforskningspaketen.

spidertron-engineer-enable-upgrade-size=Börjar med skalfaktorn 0,6 och slutar med 1,2.
spidertron-engineer-constant-size-scale=Har bara effekt om [font=default-bold]Öka storleken med uppgraderingar[/font] är inaktiverat.

