spidertron-engineer-1=Uppgraderad Spidertron med kulsprutepistol och hagelgevär
spidertron-engineer-2=Har även eldkastare, raketgevär och ett litet utrustningsrutnät på 5x5
spidertron-engineer-3=Lägger till ett stridshagelgevär, ett andra raketgevär och ett större utrustningsrutnät på 7x7
